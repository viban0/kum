name: Web Monitor Scraper

on:
  workflow_dispatch: # cron-job.org 또는 GitHub UI에서 수동/API 호출 가능
  schedule:
    - cron: '*/30 * * * *' # 30분마다 자동 실행 (필요 시 주기 변경 가능)

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # git-auto-commit-action 실행에 필요한 레포지토리 쓰기 권한

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scrapers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py || true
          python dorm_monitor.py || true
          python kmu_monitor.py || true

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update monitoring state data [skip ci]"
          file_pattern: "*.txt"
