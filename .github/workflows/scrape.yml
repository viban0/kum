name: KMU Notice Scraper

on:
  workflow_dispatch: # cron-job.org 또는 GitHub API/버튼 클릭으로 실행 가능
  schedule:
    - cron: '*/30 * * * *' # GitHub Actions 30분 주기 스케줄링

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # kmu_data.txt 푸시를 위한 쓰기 권한

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run KMU Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python kmu_monitor.py

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update kmu_data.txt [skip ci]"
          file_pattern: "kmu_data.txt"
